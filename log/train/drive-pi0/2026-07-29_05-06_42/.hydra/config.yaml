_target_: src.agent.drivepi0.train.DrivePiZeroTrainAgent
log_dir: log/train/${name}/${now:%Y-%m-%d}_${now:%H-%M}_${seed}
name: drive-pi0
device: cuda
n_nodes: 1
seed: 42
pretrained_model_path: ckpts/paligemma-3b-pt-224
load_pretrained_weights: true
resume_checkpoint_path: null
train_vlm: true
action_expert_adaptive_mode: null
use_torch_compile: true
use_bf16: true
use_amp: true
quantize: false
lora: false
lora_r: 32
lora_dropout: 0.0
data:
  train:
    statistics_path: config/statistics/b2d_statistics.json
    work_dir: exp/b2d_action
    split: train
    return_camera_id: false
    return_scenario_id: false
    is_drivemoe: false
    set_scene_priority: false
  val:
    statistics_path: config/statistics/b2d_statistics.json
    work_dir: exp/b2d_action
    split: val
    return_camera_id: false
    return_scenario_id: false
    is_drivemoe: false
    set_scene_priority: false
wandb:
  entity: ${oc.env:WANDB_ENTITY}
  project: drive-pi0
  run: ${now:%H-%M-%S}_${name}
log_freq: 16
n_epochs: 12
n_updates: ${eval:'225348 // ${global_batch_size} * ${n_epochs}'}
save_model_freq: ${eval:'225348 // ${global_batch_size} * 1'}
eval_freq: 2000
eval_size: 1024
eval_thresholds:
- 0.05
- 0.1
- 0.2
- 0.3
- 0.5
global_batch_size: 1024
per_device_batch_size: 8
num_workers: 8
action_lr: 5.0e-05
vlm_lr: 5.0e-05
action_lr_scheduler:
  first_cycle_steps: 10000000
  min_lr: 1.0e-08
  warmup_steps: 200
vlm_lr_scheduler:
  first_cycle_steps: 10000000
  min_lr: 1.0e-08
  warmup_steps: 200
action_weight_decay: 0
vlm_weight_decay: 0
max_grad_norm: 1.0
flow_sampling: beta
num_inference_steps: 10
final_action_clip_value: 1.0
cond_steps: 5
horizon_steps: 10
action_dim: 2
proprio_dim: 10
max_seq_len: 532
tokenizer_padding: max_length
max_image_text_tokens: ${max_seq_len}
mixture:
  vlm:
    hidden_size: 2048
    intermediate_size: 16384
    use_final_norm: false
    cache: true
    use_quantize: ${quantize}
    use_lora: ${lora}
    adaptive_mode: null
  proprio:
    hidden_size: 1024
    intermediate_size: 4096
    use_final_norm: true
    cache: true
    use_quantize: false
    use_lora: false
    adaptive_mode: ${action_expert_adaptive_mode}
  action:
    hidden_size: 1024
    intermediate_size: 4096
    use_final_norm: true
    cache: false
    use_quantize: false
    use_lora: false
    adaptive_mode: ${action_expert_adaptive_mode}
time_hidden_size: 256
image_token_index: 257152
vocab_size: 257216
pad_token_id: 0
vision:
  _target_: src.model.paligemma.siglip.SiglipVisionModel
  config:
    hidden_size: 1152
    intermediate_size: 4304
    num_hidden_layers: 27
    num_attention_heads: 16
    num_channels: 3
    image_size: 224
    patch_size: 14
    layer_norm_eps: 1.0e-06
    attention_dropout: 0.0
    num_image_tokens: 512
    lora:
      r: ${lora_r}
      dropout: ${lora_dropout}
  use_quantize: ${quantize}
  use_lora: ${lora}
vision_projector:
  _target_: src.model.paligemma.siglip.PaliGemmaMultiModalProjector
  config:
    vision_config:
      hidden_size: 1152
      projection_dim: 2048
    lora:
      r: ${lora_r}
      dropout: ${lora_dropout}
  use_quantize: ${quantize}
  use_lora: ${lora}
joint:
  _target_: src.model.DrivePi0.joint_model.JointModel
  config:
    action_expert_adaptive_mode: ${action_expert_adaptive_mode}
    time_hidden_size: ${time_hidden_size}
    mixture: ${mixture}
    lora:
      r: ${lora_r}
      dropout: ${lora_dropout}
    num_hidden_layers: 18
    num_attention_heads: 8
    num_key_value_heads: 1
    head_dim: 256
    max_position_embeddings: 8192
    rms_norm_eps: 1.0e-06
    rope_theta: 10000.0
    attention_bias: false
    attention_dropout: 0.0
    pad_token_id: ${pad_token_id}
